<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Punto EP · Carta digital</title>
<meta name="description" content="Carta de Punto EP: menú diario con bebida y postre, salados, desayunos y meriendas, cafetería y bebidas. Todos los días de 6 a 22 hs.">
<meta name="theme-color" content="#111111">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,700;1,800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/pedido.css">
<script src="../shared/pedido.js"></script>
<style>
:root{--r:#d4121b;--r-2:#a80d14;--k:#111;--k-2:#1b1b1b;--w:#fff;--mute:#c9c9c9}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:60px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{font-family:Barlow,system-ui,sans-serif;background:var(--k);color:var(--w);-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:'Barlow Condensed',system-ui,sans-serif;text-transform:uppercase}

/* tiras rojas en diagonal, como en el menú impreso */
.slash{position:absolute;height:34px;width:150px;background:repeating-linear-gradient(115deg,var(--r) 0 18px,transparent 18px 28px);opacity:.95}

/* ---------- portada ---------- */
.hero{position:relative;overflow:hidden;padding:28px 20px 30px;text-align:center;background:radial-gradient(120% 80% at 70% 0%,#3a0b0e 0%,var(--k) 60%)}
.hero .slash{top:18px;right:-20px}.hero .slash.b{top:auto;bottom:16px;left:-30px;right:auto}
.hero .logo{width:130px;height:130px;display:block;margin:0 auto;position:relative;z-index:1;filter:drop-shadow(0 6px 16px rgba(212,18,27,.45))}
.sec h1{font-style:italic;font-weight:800;font-size:clamp(3rem,15vw,4.6rem);line-height:.9;letter-spacing:.01em}
.sec h1 span{color:var(--r);margin-left:.22em}
.pre{margin-bottom:22px;padding-bottom:18px;border-bottom:2px solid var(--r)}
#menu-diario{padding-top:26px}
.ribbon{display:inline-block;background:var(--r);color:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1.25rem;letter-spacing:.03em;text-transform:uppercase;padding:4px 18px;transform:skewX(-10deg);margin-top:10px}
.ribbon>span{display:inline-block;transform:skewX(10deg)}

/* ---------- nav ---------- */
.nav{position:sticky;top:0;z-index:20;background:rgba(17,17,17,.96);backdrop-filter:blur(6px);border-bottom:2px solid var(--r)}
.nav ul{display:flex;gap:6px;overflow-x:auto;list-style:none;padding:10px 16px;max-width:980px;margin:0 auto;scrollbar-width:none}
.nav ul::-webkit-scrollbar{display:none}
.nav a{display:block;white-space:nowrap;padding:5px 14px;border:2px solid var(--r);border-radius:999px;color:#fff;text-decoration:none;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.95rem;letter-spacing:.06em;text-transform:uppercase}
.nav a[aria-current="true"]{background:var(--r)}

/* ---------- secciones ---------- */
.sec{padding:38px 0 6px}
.sec.wrap{padding-left:20px;padding-right:20px}
.sec h2{font-style:italic;font-weight:800;font-size:clamp(2rem,9vw,3rem);line-height:1}
.sec h2 em{font-style:inherit;color:var(--r)}
.brush{display:inline-block;background:var(--r);color:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1.05rem;letter-spacing:.04em;text-transform:uppercase;padding:3px 14px;transform:skewX(-10deg);margin:14px 0 4px}
.brush>span{display:inline-block;transform:skewX(10deg)}
.brush.w{background:#fff;color:var(--r-2)}
.lead{font-size:.95rem;color:var(--mute);margin-top:6px}
.cols{columns:2 340px;column-gap:28px;margin-top:12px}
.items{list-style:none}
.it{break-inside:avoid;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:12px 16px;margin-bottom:8px;background:var(--k-2);border-left:5px solid var(--r)}
.it h4{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:1.3rem;letter-spacing:.03em;text-transform:uppercase;line-height:1.15}
.it .pr{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1.25rem;white-space:nowrap}
.it p{grid-column:1/-1;font-size:.86rem;line-height:1.45;color:var(--mute)}
.chips{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chips li{padding:7px 14px;border:1.5px solid rgba(255,255,255,.28);border-radius:999px;font-weight:500;font-size:.95rem}

/* ---------- contacto ---------- */
.info{padding:48px 20px 14px;text-align:center}
.info .t{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1.5rem;text-transform:uppercase;letter-spacing:.03em;line-height:1.2}
.info .t b{display:block;color:var(--r);font-size:1.9rem;white-space:nowrap}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:12px 20px;border-radius:999px;text-decoration:none;font-weight:600;font-size:1rem;color:#fff;border:2px solid var(--r)}
.btn.fill{background:var(--r)}
.btn svg{width:22px;height:22px;flex:none}
.serv{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin-top:22px;justify-content:center}
.serv li{padding:6px 14px;background:var(--k-2);border:1px solid rgba(255,255,255,.14);border-radius:999px;font-size:.88rem;color:#d8d8d8}
footer{padding:26px 20px 44px;text-align:center;font-size:.8rem;color:#8a8a8a}
</style>
</head>
<body>
<header class="hero">
  <span class="slash" aria-hidden="true"></span><span class="slash b" aria-hidden="true"></span>
  <img class="logo" src="img/logo.webp" alt="Punto EP" width="480" height="480">
</header>
<nav class="nav" aria-label="Secciones de la carta"><ul id="nav"></ul></nav>
<main class="wrap" id="menu" style="padding:0"></main>

<section class="info" aria-label="Contacto">
  <p class="t">Lunes a domingos <b>06:00 a 22:00</b></p>
  <div class="btns">
    <a class="btn fill" href="https://wa.me/5493513490751" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.200zm4.500-6.100c-.2-.1-1.500-.7-1.700-.8s-.4-.1-.6.100-.6.8-.8 1-.3.2-.5.1a6.700 6.700 0 0 1-3.300-2.900c-.2-.4.300-.4.700-1.300.1-.2 0-.3 0-.4l-.8-1.800c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.300 3 3 0 0 0-.9 2.200 5.200 5.200 0 0 0 1.100 2.800 11.900 11.900 0 0 0 4.600 4c1.700.7 2.400.8 3.200.7a2.700 2.700 0 0 0 1.800-1.300 2.200 2.200 0 0 0 .2-1.300c-.1-.1-.3-.2-.6-.3z"/></svg>
      +54 9 3513 49-0751
    </a>
    <a class="btn" href="https://www.instagram.com/punto_ep/" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.500" cy="6.500" r="1" fill="currentColor" stroke="none"/></svg>
      @punto_ep
    </a>
  </div>
  <ul class="serv" aria-label="Servicios"><li>Combustible</li><li>Mercado</li><li>Café</li><li>WiFi</li></ul>
</section>
<footer>Punto EP · Precios en pesos argentinos.</footer>

<script>
// ---------- datos ----------
// Menú diario y categorías: de la carta impresa. Los productos y TODOS los precios son de ejemplo para la demo.
// it: [nombre, precio | {variante: precio}, descripción?]
const SECS = [
 {id: 'menu-diario', t: 'Elegí tu <em>menú</em>', nav: 'Menú diario', brush: '+ Guarnición incluida', pre: '<h1>Menú<span>diario</span></h1><div class="ribbon"><span>Con bebida + postre</span></div>', items: [
  ['Costeleta de vaca', 14500, 'Con guarnición a elección, bebida y postre.'],
  ['Costeleta de cerdo', 13900, 'Con guarnición a elección, bebida y postre.'],
  ['Bife de pollo', 12900, 'Con guarnición a elección, bebida y postre.'],
  ['Bife de cuadril', 14900, 'Con guarnición a elección, bebida y postre.'],
  ['Milanesa vacuna', 13500, 'Con guarnición a elección, bebida y postre.'],
  ['Suprema de pollo', 13500, 'Con guarnición a elección, bebida y postre.'],
 ], chips: {t: 'Guarnición a elección', items: ['Puré de papas', 'Puré de calabaza', 'Puré mixto', 'Papas fritas', 'Ensalada dos colores']}},
 {id: 'salados', t: 'También <em>disfrutá</em> de', nav: 'Salados', items: [
  ['Tarta de jamón y queso', 6500, 'Porción.'],
  ['Tarta de zapallitos', 6500, 'Porción.'],
  ['Tarta de choclo', 6500, 'Porción.'],
  ['Pizzeta', {Muzzarella: 5200, Napolitana: 5900}],
  ['Empanada', {Carne: 2200, Pollo: 2200, 'Jamón y queso': 2200, Humita: 2200}, 'Al horno. Precio por unidad.'],
  ['Sandwich de milanesa completo', 11900, 'Lechuga, tomate y huevo.'],
  ['Lomito completo', 12900, 'Con papas fritas.'],
  ['Tostado de jamón y queso', 6900],
  ['Ensalada César', 10900, 'Pollo grillado, lechuga, crutones y parmesano.'],
  ['Ensalada de atún', 10900, 'Atún, lechuga, tomate, huevo y cebolla.'],
  ['Ensalada de colores', 9500, 'Zanahoria, remolacha, huevo y tomate.'],
 ]},
 {id: 'desayunos', t: 'Desayuná y <em>merendá</em>', nav: 'Desayunos', brush: 'Con nosotros', items: [
  ['Desayuno clásico', 6900, 'Café o té + dos medialunas.'],
  ['Desayuno completo', 9500, 'Café o té, jugo de naranja exprimido y tostadas con manteca y mermelada.'],
  ['Tostado de jamón y queso', 6500, 'Pan de miga tostado.'],
  ['Medialunas x3', 3600, 'De manteca.'],
  ['Licuado', {'Con agua': 4900, 'Con leche': 5900}, 'De banana, frutilla o durazno.'],
  ['Licuado de banana y chocolate', 6500, 'Con leche.'],
 ]},
 {id: 'cafeteria', t: 'Cafe<em>tería</em>', items: [
  ['Espresso', 2800], ['Café chico', 3200], ['Café con leche', 3900], ['Cortado', 3500],
  ['Capuccino', 4800, 'Con espuma de leche y cacao.'], ['Submarino', 5200, 'Leche caliente con barra de chocolate.'],
  ['Chocolatada', 4200, 'Fría o caliente.'], ['Té', 2900], ['Mate cocido', 2900],
 ]},
 {id: 'bebidas', t: 'Be<em>bidas</em>', items: [
  ['Gaseosa 500 cc', {'Cola': 3200, 'Lima limón': 3200, 'Naranja': 3200}],
  ['Agua mineral 500 cc', {'Sin gas': 2400, 'Con gas': 2400}],
  ['Jugo de naranja exprimido', 4900],
  ['Agua saborizada 500 cc', 3000],
 ]},
 {id: 'golosinas', t: 'Golosinas y <em>chocolates</em>', nav: 'Golosinas', brush: 'Y mucho más', items: [
  ['Alfajor', 1800], ['Chocolate en barra', 3500], ['Chicles', 1200], ['Caramelos', 1000], ['Galletitas dulces', 2300], ['Papas fritas', 2800],
 ]},
];

// ---------- render ----------
const money = n => '$ ' + n.toLocaleString('es-AR');
const price = p => typeof p === 'number' ? money(p) : 'Desde ' + money(Math.min(...Object.values(p)));
const item = ([n, p, d]) => `<li class="it"${Pedido.attr(n, p, {d})}><h4>${n}</h4><span class="pr">${price(p)}</span>${d ? `<p>${d}</p>` : ''}</li>`;
const section = s => `<section class="sec wrap" id="${s.id}" aria-labelledby="${s.id}-t">
  ${s.pre ? `<div class="pre">${s.pre}</div>` : ''}<h2 id="${s.id}-t">${s.t}</h2>
  ${s.brush ? `<span class="brush"><span>${s.brush}</span></span>` : ''}${s.lead ? `<p class="lead">${s.lead}</p>` : ''}
  <div class="cols"><ul class="items">${s.items.map(item).join('')}</ul></div>
  ${s.chips ? `<span class="brush w"><span>${s.chips.t}</span></span><ul class="chips">${s.chips.items.map(c => `<li>${c}</li>`).join('')}</ul>` : ''}
</section>`;
document.getElementById('menu').innerHTML = SECS.map(section).join('');
document.getElementById('nav').innerHTML = SECS.map(s => `<li><a href="#${s.id}">${s.nav || s.t.replace(/<[^>]+>/g, '')}</a></li>`).join('');

// ---------- pedido para el salón (módulo compartido) ----------
Pedido.init({pickText: 'Elegí una opción', theme: {btn: '#d4121b', btnFg: '#ffffff', bg: '#161616', fg: '#ffffff', mute: '#c9c9c9', line: 'rgba(255,255,255,.2)', price: '#ffffff', field: 'rgba(255,255,255,.08)', font: 'Barlow,system-ui,sans-serif'}});

// la carta se dibuja con JS: el navegador ya no salta solo al #hash
if (location.hash) document.querySelector(location.hash)?.scrollIntoView();

// ---------- scroll-spy ----------
const navUl = document.getElementById('nav'), links = [...navUl.querySelectorAll('a')];
let current;
const spy = new IntersectionObserver(es => es.forEach(e => {
  const a = links.find(l => l.hash === '#' + e.target.id);
  if (!e.isIntersecting || a === current) return;
  current?.removeAttribute('aria-current');
  a.setAttribute('aria-current', 'true');
  current = a;
  navUl.scrollTo({left: a.offsetLeft - (navUl.clientWidth - a.offsetWidth) / 2, behavior: 'smooth'});
}), {rootMargin: '-40% 0px -55% 0px'});
document.querySelectorAll('.sec').forEach(s => spy.observe(s));
navUl.addEventListener('click', e => {
  const a = e.target.closest('a');
  if (!a) return;
  e.preventDefault();
  document.querySelector(a.hash).scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
});
</script>
</body>
</html>
